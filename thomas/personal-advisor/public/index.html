<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathway Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header>
      <h1>Pathway Chat</h1>
      <p>Ask about your degree plan.</p>
    </header>

    <details class="courses" open>
      <summary>My plan</summary>
      <label for="target">Transfer goal</label>
      <select id="target">
        <option value="">Not sure yet (AA only)</option>
      </select>
      <label for="courses">My courses</label>
      <textarea id="courses" rows="3" placeholder="ENC 1101 (A), MAC 2311 (B), MAC 2312 (IP), BSC 2010 (W)"></textarea>
      <p class="hint">Add a grade in parentheses, (IP) if in progress, or (W) if withdrawn. No tag means passed. Type FCLE if you passed the civic literacy exam.</p>
    </details>

    <div id="messages" class="messages" aria-live="polite"></div>

    <form id="chat-form" class="composer">
      <input id="input" type="text" placeholder="e.g. What should I take my first semester?" autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
